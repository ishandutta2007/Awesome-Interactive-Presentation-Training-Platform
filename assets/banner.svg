<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      .bg-rect { fill: url(#bgGrad); }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #FFFFFF;
        letter-spacing: -0.5px;
      }
      .gradient-text {
        fill: url(#primaryGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #F8FAFC;
      }
      .chart-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #CBD5E1;
      }

      /* CSS Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 45px; y: 155px; }
        50% { height: 75px; y: 125px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 95px; y: 105px; }
        50% { height: 60px; y: 140px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 65px; y: 135px; }
        50% { height: 110px; y: 90px; }
      }
      @keyframes barGrow4 {
        0%, 100% { height: 115px; y: 85px; }
        50% { height: 85px; y: 115px; }
      }
      @keyframes ping {
        0% { r: 4px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }

      .floating-card-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card-2 { animation: floatReverse 7s ease-in-out infinite; }
      .pulsing-orb-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .pulsing-orb-2 { animation: pulseGlow 9s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
      .bar-anim-1 { animation: barGrow1 4s ease-in-out infinite; }
      .bar-anim-2 { animation: barGrow2 4.5s ease-in-out infinite; }
      .bar-anim-3 { animation: barGrow3 3.8s ease-in-out infinite; }
      .bar-anim-4 { animation: barGrow4 5s ease-in-out infinite; }
      .ping-dot { animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .signal-line { stroke-dasharray: 6 6; animation: dashFlow 2s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" class="bg-rect" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="180" cy="80" r="140" fill="#6366F1" opacity="0.3" filter="url(#glow)" class="pulsing-orb-1" />
  <circle cx="1020" cy="320" r="160" fill="#EC4899" opacity="0.25" filter="url(#glow)" class="pulsing-orb-2" />
  <circle cx="600" cy="400" r="180" fill="#3B82F6" opacity="0.2" filter="url(#glow)" />

  <!-- Decorative Live Activity Elements (Background/Sides) -->
  
  <!-- Left Side: Interactive Live Polling Card Widget -->
  <g class="floating-card-1" transform="translate(45, 120)">
    <rect width="210" height="230" rx="16" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" backdrop-filter="blur(10px)"/>
    <!-- Header -->
    <circle cx="28" cy="28" r="6" fill="#10B981" />
    <circle cx="28" cy="28" r="6" stroke="#10B981" fill="none" class="ping-dot" />
    <text x="44" y="32" class="chart-label" font-weight="700" fill="#F1F5F9">LIVE AUDIENCE POLL</text>
    <path d="M 18 50 L 192 50" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- Animated Chart Bars -->
    <rect x="30" y="105" width="28" height="95" rx="6" fill="url(#primaryGrad)" class="bar-anim-2" />
    <text x="34" y="215" class="chart-label">A (42%)</text>

    <rect x="74" y="85" width="28" height="115" rx="6" fill="url(#cyanGrad)" class="bar-anim-4" />
    <text x="78" y="215" class="chart-label">B (58%)</text>

    <rect x="118" y="135" width="28" height="65" rx="6" fill="url(#amberGrad)" class="bar-anim-3" />
    <text x="122" y="215" class="chart-label">C (26%)</text>

    <rect x="162" y="155" width="28" height="45" rx="6" fill="url(#emeraldGrad)" class="bar-anim-1" />
    <text x="166" y="215" class="chart-label">D (14%)</text>
  </g>

  <!-- Right Side: Interactive Quiz & Engagement Widget -->
  <g class="floating-card-2" transform="translate(945, 115)">
    <rect width="210" height="235" rx="16" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="6" fill="#F59E0B" />
    <text x="42" y="32" class="chart-label" font-weight="700" fill="#F1F5F9">LEADERBOARD &amp; Q&amp;A</text>
    <path d="M 18 50 L 192 50" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Mini Q&A item 1 -->
    <rect x="16" y="62" width="178" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
    <text x="26" y="80" class="chart-label" font-size="10" fill="#93C5FD">💬 Best practice for breakout rooms?</text>
    <text x="26" y="94" class="chart-label" font-size="9" fill="#64748B">▲ 48 upvotes • Answered</text>

    <!-- Mini Q&A item 2 -->
    <rect x="16" y="114" width="178" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1"/>
    <text x="26" y="132" class="chart-label" font-size="10" fill="#F472B6">⚡ Can we self-host BigBlueButton?</text>
    <text x="26" y="146" class="chart-label" font-size="9" fill="#64748B">▲ 32 upvotes • Live Now</text>

    <!-- Gamified Quiz Rank -->
    <rect x="16" y="166" width="178" height="48" rx="8" fill="url(#primaryGrad)" opacity="0.2"/>
    <rect x="16" y="166" width="178" height="48" rx="8" fill="none" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1"/>
    <text x="28" y="186" class="chart-label" font-size="11" font-weight="700" fill="#FFFFFF">🏆 Team Sprint Quiz</text>
    <text x="28" y="202" class="chart-label" font-size="10" fill="#CBD5E1">Leader: Team Alpha (9,450 pts)</text>
  </g>

  <!-- Dynamic Connecting Signals (Subtle) -->
  <path d="M 255 220 C 290 220, 290 140, 330 140" fill="none" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2" class="signal-line" />
  <path d="M 945 220 C 910 220, 910 140, 870 140" fill="none" stroke="rgba(236, 72, 153, 0.4)" stroke-width="2" class="signal-line" />

  <!-- Center Foreground Content: Guaranteed High Legibility & Prominence -->
  <g transform="translate(0, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(425, 52)">
      <rect width="350" height="34" rx="17" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#8B5CF6"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#C4B5FD" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="142" text-anchor="middle" class="title-text">
      Interactive Presentation &amp; Training
    </text>
    <text x="600" y="192" text-anchor="middle" class="title-text gradient-text">
      Platform Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="600" y="238" text-anchor="middle" class="subtitle-text">
      Curated SaaS Platforms, Self-Hosted Virtual Classrooms &amp; Live Audience Engagement Tools
    </text>

    <!-- Feature Badges / Pills row -->
    <g transform="translate(290, 280)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="38" rx="19" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2"/>
        <text x="69" y="24" text-anchor="middle" class="pill-text">📊 Live Polling</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="156" height="38" rx="19" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2"/>
        <text x="78" y="24" text-anchor="middle" class="pill-text">🎯 Audience Q&amp;A</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(318, 0)">
        <rect width="148" height="38" rx="19" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2"/>
        <text x="74" y="24" text-anchor="middle" class="pill-text">🏆 Live Quizzes</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(478, 0)">
        <rect width="142" height="38" rx="19" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2"/>
        <text x="71" y="24" text-anchor="middle" class="pill-text">🏫 Virtual Rooms</text>
      </g>
    </g>

    <!-- Bottom Metrics / Tagline -->
    <text x="600" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748B">
      ⭐ Real-Time Synchronous Learning • Moderated Q&amp;A • Gamified Assessments • WebRTC &amp; LTI Compatible
    </text>
  </g>
</svg>
